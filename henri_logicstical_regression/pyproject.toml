[project]
name = "hackathon2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tenseoverflow", email = "contact@hen.ee" }
]
requires-python = ">=3.14"
dependencies = [
    "catboost==1.2.10",
    "joblib==1.6.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
]

[project.scripts]
train = "henri_logicstical_regression.train:cli"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "henri_logicstical_regression"
module-root = "src"
